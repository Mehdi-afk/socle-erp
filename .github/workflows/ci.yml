# SPDX-License-Identifier: LGPL-3.0-only
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable pnpm (version and hash pinned by packageManager)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Lint CSS (no hard-coded colour, no physical direction)
        run: pnpm lint:css

      - name: Format
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Install Chromium for the real web flows
        run: pnpm --filter @socle/acceptance exec playwright install --with-deps chromium

      - name: Test the web client in Chromium
        run: pnpm --filter @socle/acceptance test:browser

      - name: Public API report (API Extractor)
        run: pnpm api:check

      - name: SPDX headers
        run: pnpm check:spdx

      - name: Dependency licenses
        run: pnpm check:licenses

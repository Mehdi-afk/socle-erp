# Socle-specific Semgrep rules (ARCHITECTURE.md §9.2). Blocking in CI.
rules:
  - id: socle-no-dynamic-code
    languages: [typescript, javascript]
    severity: ERROR
    message: eval / new Function are forbidden.
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
      - pattern: Function(...)

  - id: socle-no-raw-sql
    languages: [typescript, javascript]
    severity: ERROR
    message: Raw SQL is only allowed through Kysely's sql`` template (never sql.raw or string concatenation).
    pattern-either:
      - pattern: sql.raw(...)
      - pattern: $DB.query($A + $B, ...)
      - pattern: $DB.unsafe(...)

  - id: socle-no-unsanitized-html
    languages: [typescript, javascript]
    severity: ERROR
    message: dangerouslySetInnerHTML is forbidden outside the DOMPurify-based SafeHtml component.
    paths:
      exclude: ['/packages/ui/src/safe-html/**']
    pattern: <$EL dangerouslySetInnerHTML={...} />

  - id: socle-module-no-direct-network
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Modules must not reach the network directly; use the HTTP client of their runtime context,
      limited to the hosts declared in the manifest capabilities.
    paths:
      include: ['/modules/**']
    pattern-either:
      - pattern: fetch(...)
      - pattern: new XMLHttpRequest(...)
      - pattern: new WebSocket(...)
      - pattern: import $X from 'node:http'
      - pattern: import $X from 'node:https'
      - pattern: import $X from 'node:net'
      - pattern: import $X from 'http'
      - pattern: import $X from 'https'
      - pattern: import $X from 'net'
      - pattern: require('http')
      - pattern: require('https')
      - pattern: require('node:https')
      - pattern: require('node:http')
